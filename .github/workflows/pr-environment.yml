# Per-PR ephemeral Azure environment: provision -> deploy -> smoke -> comment.
#
# Design: docs/design/pr-ephemeral-environments.md (sections "Deployment path",
# "Workflow concurrency", "Cost & lifecycle", "Security guardrails").
#
# SECURITY MODEL (why this uses `pull_request`, never `pull_request_target`):
# `pull_request` runs in the *head* context with a read-only token and NO access
# to the `azure-pr-app` environment's OIDC federation for forks, so a fork PR can
# never obtain Azure credentials. `pull_request_target` would run privileged in
# the base context and hand fork code write access + secrets -- exactly what we
# refuse to do, including "just for the comment step".
#
# The fork / draft / same-repo / concurrency verdict is NOT re-implemented in
# YAML. It is produced by infra/scripts/pr_preflight.py, whose strict-boolean
# trust check exists precisely because truthiness coercion on
# `github.event.pull_request.head.repo.fork` was a live fail-open bug. Fork PRs
# are excluded at the JOB level: the deploy job only runs when the preflight job
# emits decision == 'proceed', so a fork never reaches an Azure step.
#
# Out of scope here (do not add): `closed` teardown + daily TTL janitor are
# Phase 4 (#20); budget/observability tuning is Phase 5 (#18); the Foundry
# approval gate is Phase 6 (#17 / #2). This workflow deploys the app tier only.

name: PR Azure Environment

on:
  pull_request:
    # `ready_for_review` is included deliberately: draft PRs are a preflight SKIP
    # (no deploy). Marking a draft ready does not emit `synchronize` on its own,
    # so without this type a PR opened as draft would never deploy on the
    # ready transition. `opened`/`reopened`/`synchronize` cover the normal path.
    types: [opened, reopened, synchronize, ready_for_review]

# Default to read-only; each job widens only what it needs (requirement #3).
permissions:
  contents: read

# One concurrency group per PR number; a new push cancels obsolete provisioning
# / deployment for the same PR (design: "Workflow concurrency").
concurrency:
  group: pr-azure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # --- Gate: fork / draft / same-repo / name validity ------------------------
  # No Azure permissions, no id-token. Consumes pr_preflight.py's verdict.
  preflight:
    name: Preflight gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      reason_code: ${{ steps.gate.outputs.reason_code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Evaluate deploy preflight
        id: gate
        # Every PR-controlled value arrives via env and is read as "$VAR"; none
        # is interpolated into this script (requirement #4). PR title/body are
        # never referenced here.
        env:
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SHARED_ACR_NAME: ${{ vars.SHARED_CONTAINER_REGISTRY_NAME }}
        run: |
          set -uo pipefail
          # active-app-env-count is a documented pre-login placeholder (0): the
          # real, authoritative cap check needs an Azure query and therefore runs
          # in the deploy job AFTER OIDC login. It cannot be used to bypass the
          # cap because the post-login recheck re-runs pr_preflight with the real
          # count and fails the run on BLOCKED.
          output="$(python3 infra/scripts/pr_preflight.py \
            --repo "$BASE_REPO" \
            --pr-number "$PR_NUMBER" \
            --branch "$HEAD_BRANCH" \
            --is-fork "$IS_FORK" \
            --is-draft "$IS_DRAFT" \
            --base-repo "$BASE_REPO" \
            --head-repo "$HEAD_REPO" \
            --referenced-acr-name "$SHARED_ACR_NAME" \
            --active-app-env-count 0 \
            --format env)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" >> "$GITHUB_OUTPUT"
          # Never fail here: the enforce step below turns a BLOCKED verdict into a
          # visible run failure, while a SKIP (draft) exits cleanly.

      - name: Enforce verdict (BLOCKED fails the run, SKIP does not)
        if: steps.gate.outputs.decision == 'blocked'
        env:
          REASON: ${{ steps.gate.outputs.reason_code }}
        run: |
          echo "::error::PR environment deploy refused by preflight (reason: ${REASON})."
          exit 1

  # --- Deploy: OIDC login, provision, deploy, smoke --------------------------
  # id-token: write lives ONLY on this job (requirement #3). Fork PRs never reach
  # it because the job-level `if` requires a 'proceed' verdict.
  deploy:
    name: Provision and deploy
    needs: preflight
    if: needs.preflight.outputs.decision == 'proceed'
    runs-on: ubuntu-latest
    environment: azure-pr-app
    permissions:
      contents: read
      id-token: write
    outputs:
      environment_name: ${{ steps.names.outputs.environment_name }}
      app_url: ${{ steps.endpoint.outputs.app_url }}
      smoke_passed: ${{ steps.smoke.outputs.passed }}
      smoke_message: ${{ steps.smoke.outputs.message }}
      expires_at: ${{ steps.tags.outputs.expires_at }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install azd
        uses: Azure/setup-azd@634ad924cf8baef2257898ba5663be8d19f15aca # v2.3.0

      - name: Compute names and export the Bicep name contract
        id: names
        env:
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # BICEPPARAM_ENV_VARS contract -> $GITHUB_ENV so infra/main.bicepparam
          # reads the Azure-limit-safe names via readEnvironmentVariable. This is
          # item A's authoritative mapping; no name is hand-transcribed.
          python3 infra/scripts/pr_environment_names.py \
            --repo "$BASE_REPO" --pr-number "$PR_NUMBER" --branch "$HEAD_BRANCH" \
            --format envvars >> "$GITHUB_ENV"
          # Log-safe human projection (no repo) -> step outputs for the comment.
          python3 infra/scripts/pr_environment_names.py \
            --repo "$BASE_REPO" --pr-number "$PR_NUMBER" --branch "$HEAD_BRANCH" \
            --format env >> "$GITHUB_OUTPUT"

      - name: Resolve the two identity names (item A deferral)
        run: |
          set -euo pipefail
          # Item A deferred this: the naming module emits ONE managed_identity
          # token, but Bicep needs two distinct identities (platform + app). We
          # derive both from the module's already-bounded managed-environment
          # token (CONTAINER_APPS_ENVIRONMENT_NAME, <=32 chars) rather than from
          # the unbounded environment name, so `id-<token>-plat/-app` can never
          # overflow the 128-char managed-identity limit even for a pathological
          # slug. Distinct suffixes keep them unique and stable across pushes.
          echo "PLATFORM_IDENTITY_NAME=id-${CONTAINER_APPS_ENVIRONMENT_NAME}-plat" >> "$GITHUB_ENV"
          echo "APPLICATION_IDENTITY_NAME=id-${CONTAINER_APPS_ENVIRONMENT_NAME}-app" >> "$GITHUB_ENV"

      - name: Export per-PR child-resource identity tags
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # Stable identity tags propagated onto CHILD resources by main.bicep at
          # provision time (this runs BEFORE `azd provision`). This is the drift-
          # free subset of the resource-group tag set: `expires-at` is intentionally
          # NOT exported because it is reset on the RG every deploy and is the only
          # tag the TTL janitor reads (from the RG, never from child resources).
          # author is attacker-influenced (PR author login) so it is passed via env
          # and quoted, never interpolated from github.event.
          {
            echo "EPHEMERAL_CHILD_TAG=true"
            echo "PR_NUMBER_TAG=${PR_NUMBER}"
            echo "AUTHOR_TAG=${PR_AUTHOR}"
            echo "CREATED_AT_TAG=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Configure shared bindings and required infra inputs
        env:
          SHARED_CONTAINER_REGISTRY_NAME: ${{ vars.SHARED_CONTAINER_REGISTRY_NAME }}
          SHARED_CONTAINER_REGISTRY_RESOURCE_GROUP_NAME: ${{ vars.SHARED_CONTAINER_REGISTRY_RESOURCE_GROUP_NAME }}
          SHARED_FOUNDRY_ACCOUNT_NAME: ${{ vars.SHARED_FOUNDRY_ACCOUNT_NAME }}
          SHARED_FOUNDRY_PROJECT_NAME: ${{ vars.SHARED_FOUNDRY_PROJECT_NAME }}
          SHARED_FOUNDRY_RESOURCE_GROUP_NAME: ${{ vars.SHARED_FOUNDRY_RESOURCE_GROUP_NAME }}
          MODEL_DEPLOYMENT_NAME: ${{ vars.SHARED_MODEL_DEPLOYMENT_NAME }}
          ALERT_CONTACT_EMAILS: ${{ vars.AZURE_ALERT_CONTACT_EMAILS }}
        run: |
          set -euo pipefail
          # PR environments bind to the shared ACR + shared Foundry and never
          # provision either (design non-goals).
          {
            echo "DEPLOY_ACR=false"
            echo "DEPLOY_FOUNDRY=false"
            echo "SHARED_CONTAINER_REGISTRY_NAME=${SHARED_CONTAINER_REGISTRY_NAME}"
            echo "SHARED_CONTAINER_REGISTRY_RESOURCE_GROUP_NAME=${SHARED_CONTAINER_REGISTRY_RESOURCE_GROUP_NAME}"
            echo "SHARED_FOUNDRY_ACCOUNT_NAME=${SHARED_FOUNDRY_ACCOUNT_NAME}"
            echo "SHARED_FOUNDRY_PROJECT_NAME=${SHARED_FOUNDRY_PROJECT_NAME}"
            echo "SHARED_FOUNDRY_RESOURCE_GROUP_NAME=${SHARED_FOUNDRY_RESOURCE_GROUP_NAME}"
            echo "MODEL_DEPLOYMENT_NAME=${MODEL_DEPLOYMENT_NAME}"
          } >> "$GITHUB_ENV"

          # Minimum-viable values for the infra inputs main.bicepparam requires
          # with no default. These are just enough to let `azd provision` run for
          # a small ephemeral app; real budget/alert/observability tuning is
          # Phase 5 (#18) and is intentionally NOT built here.
          {
            echo "AZURE_CONTAINER_APPS_WORKLOAD_PROFILE_TYPE=Consumption"
            echo "AZURE_CONTAINER_APPS_WORKLOAD_PROFILE_MIN_COUNT=0"
            echo "AZURE_CONTAINER_APPS_WORKLOAD_PROFILE_MAX_COUNT=1"
            echo "AZURE_CONTAINER_APP_CPU=0.5"
            echo "AZURE_CONTAINER_APP_MEMORY=1.0Gi"
            echo "AZURE_MONTHLY_BUDGET_AMOUNT=50"
            echo "AZURE_BUDGET_START_DATE=$(date -u +%Y-%m-01)"
            echo "AZURE_ALERT_CONTACT_EMAILS=${ALERT_CONTACT_EMAILS}"
            echo "AZURE_ENABLE_APPLICATION_SIGNAL_ALERTS=false"
          } >> "$GITHUB_ENV"

      - name: azd auth login (OIDC, no stored secrets)
        run: |
          set -euo pipefail
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github

      - name: Azure CLI login (OIDC, for az group/tag/query)
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Enforce app-tier concurrency cap
        env:
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SHARED_ACR_NAME: ${{ vars.SHARED_CONTAINER_REGISTRY_NAME }}
        run: |
          set -uo pipefail
          # Count active app-tier PR environments by tag, excluding this PR's own
          # group so a redeploy never counts against itself. PR_NUMBER is a
          # validated integer read from env, not interpolated from github.event.
          active="$(az group list --query "length([?tags.ephemeral=='true' && tags.\"environment-type\"=='pr-app' && tags.\"pr-number\"!='${PR_NUMBER}'])" -o tsv)"
          echo "Active app-tier PR environments (excluding this PR): ${active}"
          # Authoritative cap check via pr_preflight (fails closed at 3). BLOCKED
          # -> non-zero exit -> the run fails before we provision anything.
          output="$(python3 infra/scripts/pr_preflight.py \
            --repo "$BASE_REPO" \
            --pr-number "$PR_NUMBER" \
            --branch "$HEAD_BRANCH" \
            --is-fork false \
            --is-draft false \
            --base-repo "$BASE_REPO" \
            --head-repo "$HEAD_REPO" \
            --referenced-acr-name "$SHARED_ACR_NAME" \
            --active-app-env-count "$active" \
            --format env)"
          rc=$?
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            echo "::error::App-tier concurrency cap or safety check failed; refusing to provision."
            exit 1
          fi

      - name: Initialize azd environment
        run: |
          set -euo pipefail
          azd env new "$AZURE_ENV_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" \
            --no-prompt

      # provision and deploy are SEPARATE steps (never `azd up`): the design
      # requires distinct logs, gates and failure handling for each.
      - name: azd provision
        run: azd provision --no-prompt

      - name: Tag PR resource group (ephemeral + TTL)
        id: tags
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # RG tags live in the workflow, NOT in Bicep, deliberately:
          #  * infra/main.bicep is targetScope='resourceGroup' and deploys INTO
          #    the RG azd creates, so it cannot tag its own containing RG; the
          #    design forbids changing that scope.
          #  * created-at / expires-at / author / branch are PR-runtime facts,
          #    and expires-at must be reset on every push (design lifecycle).
          #  * the Phase 4 janitor enumerates RESOURCE GROUPS by these tags, so
          #    they must sit on the RG, which only the workflow can set here.
          # merge preserves azd's own tags (e.g. azd-env-name needed for down).
          # author/branch are attacker-influenced -> passed via env, quoted.
          rg="$(azd env get-value AZURE_RESOURCE_GROUP)"
          rg_id="$(az group show -n "$rg" --query id -o tsv)"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires="$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)"
          az tag update --resource-id "$rg_id" --operation merge --tags \
            ephemeral=true \
            environment-type=pr-app \
            pr-number="$PR_NUMBER" \
            author="$PR_AUTHOR" \
            created-at="$created" \
            expires-at="$expires" \
            repo="$BASE_REPO" \
            branch="$HEAD_BRANCH"
          echo "expires_at=${expires}" >> "$GITHUB_OUTPUT"

      - name: azd deploy
        run: azd deploy --no-prompt

      - name: Resolve app URL
        id: endpoint
        run: |
          set -euo pipefail
          # azd-service-name:'web' is on the PRIVATE container app (web.bicep), so
          # `azd deploy` only pushes our image there; the public app keeps the
          # helloworld image and has no /health endpoints. Resolve the URL from the
          # canonical azd output for the deployed service instead of querying an app
          # by name. SERVICE_WEB_URI is ALREADY a full https://<fqdn>
          # (main.bicep -> web.bicep serviceUri), so do NOT prepend a scheme.
          # An empty-but-successful get-value must fail loudly HERE, not silently
          # flow into the smoke test as a confusing far-from-the-cause failure;
          # `set -euo pipefail` alone does not catch empty-but-zero-exit.
          app_url="$(azd env get-value SERVICE_WEB_URI)"
          case "$app_url" in
            https://*)
              ;;
            *)
              echo "::error::Resolved app URL is empty or not https:// (got: '${app_url}'); refusing to hand an unknown endpoint to the smoke test."
              exit 1
              ;;
          esac
          echo "app_url=${app_url}" >> "$GITHUB_OUTPUT"

      - name: Smoke test (/health/live + /health/ready)
        id: smoke
        env:
          APP_URL: ${{ steps.endpoint.outputs.app_url }}
        run: |
          set -uo pipefail
          # The URL is an Azure-issued FQDN (not attacker input); still passed
          # via env for consistency. Non-zero exit (smoke failure) fails the run;
          # the comment job still posts the failing status via always().
          output="$(python3 infra/scripts/pr_smoke_test.py \
            --base-url "$APP_URL" \
            --deadline-seconds 180 \
            --format env)"
          rc=$?
          printf '%s\n' "$output"
          printf '%s\n' "$output" >> "$GITHUB_OUTPUT"
          exit $rc

  # --- Comment: single find-and-update PR comment ----------------------------
  # pull-requests: write lives ONLY on this job. Runs after a real deploy attempt
  # (always()) so it reports pass OR fail, but never for fork/draft (skip).
  comment:
    name: Update PR comment
    needs: [preflight, deploy]
    if: always() && needs.preflight.outputs.decision == 'proceed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post or update the environment comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          ENV_NAME: ${{ needs.deploy.outputs.environment_name }}
          APP_URL: ${{ needs.deploy.outputs.app_url }}
          SMOKE_PASSED: ${{ needs.deploy.outputs.smoke_passed }}
          SMOKE_MESSAGE: ${{ needs.deploy.outputs.smoke_message }}
          EXPIRES_AT: ${{ needs.deploy.outputs.expires_at }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            // All dynamic content comes from process.env (set above from job
            // outputs); nothing secret is included. SMOKE_MESSAGE is already
            // CI-safe (pr_smoke_test sanitizes it and never echoes response
            // bodies). We never dump the naming module's as_dict (which carries
            // repo) -- only its printable projection reached these outputs.
            const marker = '<!-- pr-azure-env -->';
            const deployOk = process.env.DEPLOY_RESULT === 'success';
            const smokePassed = process.env.SMOKE_PASSED === 'true';
            const envName = process.env.ENV_NAME || '(name unavailable)';
            const appUrl = process.env.APP_URL || '';
            const expiresAt = process.env.EXPIRES_AT || '(pending)';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;

            // A smoke failure fails the deploy job, so DEPLOY_RESULT is not
            // 'success' even though the app deployed. Detect "smoke ran and did
            // not pass" from its outputs (which persist even though the step
            // exited non-zero) so the developer sees the real smoke reason
            // instead of a generic "did not complete". Healthy is reported ONLY
            // when deploy succeeded AND smoke passed.
            const smokeRan = process.env.SMOKE_PASSED === 'true'
              || process.env.SMOKE_PASSED === 'false';
            let health;
            if (deployOk && smokePassed) {
              health = '✅ Healthy — `/health/live` and `/health/ready` passed';
            } else if (smokeRan && !smokePassed) {
              const detail = process.env.SMOKE_MESSAGE || 'smoke test did not pass';
              health = `⚠️ Smoke test failed — ${detail}`;
            } else {
              health = '❌ Deployment did not complete';
            }

            const appLine = appUrl
              ? `**App URL:** ${appUrl}`
              : '**App URL:** _not available (deployment did not reach a running app)_';

            const body = [
              marker,
              '## 🌩️ PR Azure environment',
              '',
              appLine,
              `**Environment:** \`${envName}\``,
              `**Health:** ${health}`,
              `**Expires:** ${expiresAt}`,
              '',
              `[View workflow run logs](${runUrl})`,
              '',
              '<sub>Ephemeral app-tier environment. Auto-torn-down when this PR is closed (Phase 4).</sub>',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
