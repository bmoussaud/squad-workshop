# Per-PR ephemeral Azure environment: provision -> deploy -> smoke -> comment.
#
# Design: docs/design/pr-ephemeral-environments.md (sections "Deployment path",
# "Workflow concurrency", "Cost & lifecycle", "Security guardrails").
#
# SECURITY MODEL:
# This uses `pull_request_target` so GitHub evaluates this workflow from the base
# branch rather than the PR merge ref. The workflow never executes head code
# before its trusted job-level fork/same-repository/draft conditions. Preflight
# checks out the head SHA only as data, with credentials disabled, for the
# base-ref detector to inspect.
#
# Two-layer gate:
#  1. infra/scripts/pr_preflight.py owns the full verdict and reason codes
#     (name validity, fork/draft/same-repo, app cap, Foundry approval/cap). Its
#     strict-boolean parsing exists because truthiness coercion on
#     `github.event.pull_request.head.repo.fork` was a live fail-open bug.
#  2. Privileged jobs independently re-assert the non-forgeable subset
#     (not-fork, same-repo, non-draft) from GitHub event context before trusting
#     any preflight output. The policy executables are checked out from the
#     immutable base SHA, while switch inspection reads unexecuted PR content.
#
# `closed` teardown + daily TTL janitor are Phase 4 (#20);
# budget/observability tuning is Phase 5 (#18). Phase 6 (#17 / #2) adds a
# detector-driven Foundry exception gate and opt-in live Foundry validation while
# leaving the normal app-tier path automatic.

name: PR Azure Environment

on:
  pull_request_target:
    # `ready_for_review` is included deliberately: draft PRs are a preflight SKIP
    # (no deploy). Marking a draft ready does not emit `synchronize` on its own,
    # so without this type a PR opened as draft would never deploy on the
    # ready transition. `opened`/`reopened`/`synchronize` cover the normal path.
    types: [opened, reopened, synchronize, ready_for_review]

# Default to read-only; each job widens only what it needs (requirement #3).
permissions:
  contents: read

# One concurrency group per PR number; a new push cancels obsolete provisioning
# / deployment for the same PR (design: "Workflow concurrency").
concurrency:
  group: pr-azure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # --- Gate: fork / draft / same-repo / name validity ------------------------
  # No Azure permissions, no id-token. Executes base-ref policy code against PR
  # metadata/content; privileged jobs below still re-check event-context trust.
  preflight:
    name: Preflight gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      reason_code: ${{ steps.gate.outputs.reason_code }}
      requires_foundry: ${{ steps.scope.outputs.requires_foundry }}
      live_validation_requested: ${{ steps.scope.outputs.live_validation_requested }}
    steps:
      - name: Check out trusted preflight policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-policy
          persist-credentials: false
          fetch-depth: 1

      # This checkout is never executed. The trusted base detector reads only the
      # specific Bicep files it needs to inspect as PR data.
      - name: Check out PR content for trusted inspection
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr-content
          persist-credentials: false
          fetch-depth: 1

      - name: Verify checked out revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C .trusted-policy rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C .pr-content rev-parse HEAD)" = "$HEAD_SHA"

      - name: Collect detector inputs
        id: detector-inputs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });
            const changedPaths = files.map((file) => file.filename);
            const labels = (context.payload.pull_request.labels || []).map((label) => label.name);
            const base = process.env.RUNNER_TEMP || process.cwd();
            const changedPathsFile = path.join(base, 'pr-changed-paths.json');
            const labelsFile = path.join(base, 'pr-labels.json');
            fs.writeFileSync(changedPathsFile, `${changedPaths.join('\n')}\n`, { encoding: 'utf8' });
            fs.writeFileSync(labelsFile, JSON.stringify(labels), { encoding: 'utf8' });
            core.setOutput('changed_paths_file', changedPathsFile);
            core.setOutput('labels_file', labelsFile);

      - name: Detect Foundry scope and live validation label
        id: scope
        env:
          CHANGED_PATHS_FILE: ${{ steps.detector-inputs.outputs.changed_paths_file }}
          LABELS_FILE: ${{ steps.detector-inputs.outputs.labels_file }}
        run: |
          set -euo pipefail
          python3 .trusted-policy/infra/scripts/pr_foundry_scope.py \
            --changed-paths-file "$CHANGED_PATHS_FILE" \
            --labels-file "$LABELS_FILE" \
            --repo-root .pr-content \
            --format github >> "$GITHUB_OUTPUT"

      - name: Evaluate deploy preflight
        id: gate
        # Every PR-controlled value arrives via env and is read as "$VAR"; none
        # is interpolated into this script (requirement #4). PR title/body are
        # never referenced here.
        env:
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SHARED_ACR_NAME: ${{ vars.SHARED_CONTAINER_REGISTRY_NAME }}
          REQUIRES_FOUNDRY: ${{ steps.scope.outputs.requires_foundry }}
        run: |
          set -uo pipefail
          # active-app-env-count is a documented pre-login placeholder (0): the
          # real, authoritative cap check needs an Azure query and therefore runs
          # in the deploy job AFTER OIDC login. It cannot be used to bypass the
          # cap because the post-login recheck re-runs pr_preflight with the real
          # count and fails the run on BLOCKED.
          set +e
          output="$(python3 .trusted-policy/infra/scripts/pr_preflight.py \
            --repo "$BASE_REPO" \
            --pr-number "$PR_NUMBER" \
            --branch "$HEAD_BRANCH" \
            --is-fork "$IS_FORK" \
            --is-draft "$IS_DRAFT" \
            --base-repo "$BASE_REPO" \
            --head-repo "$HEAD_REPO" \
            --referenced-acr-name "$SHARED_ACR_NAME" \
            --active-app-env-count 0 \
            --requires-foundry "$REQUIRES_FOUNDRY" \
            --foundry-authorized false \
            --active-foundry-env-count 0 \
            --format env 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ] && ! printf '%s\n' "$output" | grep -qx 'decision=blocked'; then
            echo "::error::Preflight command failed before emitting a BLOCKED verdict (exit ${rc})."
            exit "$rc"
          fi
          printf '%s\n' "$output" >> "$GITHUB_OUTPUT"
          # Never fail here for a valid BLOCKED verdict: the enforce step below
          # turns policy refusal into a visible run failure, while a SKIP (draft)
          # exits cleanly.

      - name: Enforce verdict (BLOCKED fails the run, SKIP does not)
        if: steps.gate.outputs.decision == 'blocked' && steps.gate.outputs.reason_code != 'foundry_unauthorized'
        env:
          REASON: ${{ steps.gate.outputs.reason_code }}
        run: |
          echo "::error::PR environment deploy refused by preflight (reason: ${REASON})."
          exit 1

  # --- Foundry exception approval: only for detector-positive PRs --------------
  # Referencing this environment pauses the run for configured GitHub reviewers.
  # Approval is the only workflow signal that may turn foundry_authorized=true.
  foundry_exception:
    name: Approve Foundry exception
    needs: preflight
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      needs.preflight.outputs.requires_foundry == 'true' &&
      needs.preflight.outputs.reason_code == 'foundry_unauthorized'
    runs-on: ubuntu-latest
    environment: azure-foundry-provisioning
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.approved.outputs.authorized }}
    steps:
      - name: Record approval signal
        id: approved
        run: |
          set -euo pipefail
          echo "authorized=true" >> "$GITHUB_OUTPUT"
          echo "Foundry exception approved for this workflow run."

  # --- Deploy: OIDC login, provision, deploy, smoke --------------------------
  # id-token: write lives ONLY on this job (requirement #3). The job-level `if`
  # has trusted-context fork/same-repo/draft guards from the GitHub event payload
  # before consulting preflight outputs. The workflow definition and policy code
  # both come from the trusted base context.
  deploy:
    name: Provision and deploy
    needs: [preflight, foundry_exception]
    if: >-
      always() &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (needs.preflight.outputs.decision == 'proceed' ||
        (needs.preflight.outputs.requires_foundry == 'true' &&
          needs.preflight.outputs.reason_code == 'foundry_unauthorized' &&
          needs.foundry_exception.result == 'success'))
    runs-on: ubuntu-latest
    environment: azure-pr-app
    permissions:
      contents: read
      id-token: write
      pull-requests: read # enumerate open PRs for cap accounting
    outputs:
      environment_name: ${{ steps.names.outputs.environment_name }}
      app_url: ${{ steps.endpoint.outputs.app_url }}
      app_name: ${{ steps.endpoint.outputs.app_name }}
      expires_at: ${{ steps.tags.outputs.expires_at }}
    env:
      AZURE_OIDC_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      # This job's trusted event-context condition excludes forks before checkout.
      - name: Check out reviewed PR content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify reviewed PR revision
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Install azd
        uses: Azure/setup-azd@634ad924cf8baef2257898ba5663be8d19f15aca # v2.3.0

      - name: Compute names and export the Bicep name contract
        id: names
        env:
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # BICEPPARAM_ENV_VARS contract -> $GITHUB_ENV so infra/main.bicepparam
          # reads the Azure-limit-safe names via readEnvironmentVariable. This is
          # item A's authoritative mapping; no name is hand-transcribed.
          python3 infra/scripts/pr_environment_names.py \
            --repo "$BASE_REPO" --pr-number "$PR_NUMBER" --branch "$HEAD_BRANCH" \
            --format envvars >> "$GITHUB_ENV"
          # Log-safe human projection (no repo) -> step outputs for the comment.
          python3 infra/scripts/pr_environment_names.py \
            --repo "$BASE_REPO" --pr-number "$PR_NUMBER" --branch "$HEAD_BRANCH" \
            --format env >> "$GITHUB_OUTPUT"

      - name: Resolve the two identity names (item A deferral)
        run: |
          set -euo pipefail
          # Item A deferred this: the naming module emits ONE managed_identity
          # token, but Bicep needs two distinct identities (platform + app). We
          # derive both from the module's already-bounded managed-environment
          # token (CONTAINER_APPS_ENVIRONMENT_NAME, <=32 chars) rather than from
          # the unbounded environment name, so `id-<token>-plat/-app` can never
          # overflow the 128-char managed-identity limit even for a pathological
          # slug. Distinct suffixes keep them unique and stable across pushes.
          echo "PLATFORM_IDENTITY_NAME=id-${CONTAINER_APPS_ENVIRONMENT_NAME}-plat" >> "$GITHUB_ENV"
          echo "APPLICATION_IDENTITY_NAME=id-${CONTAINER_APPS_ENVIRONMENT_NAME}-app" >> "$GITHUB_ENV"

      - name: Export per-PR child-resource identity tags
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # Stable identity tags propagated onto CHILD resources by main.bicep at
          # provision time (this runs BEFORE `azd provision`). This is the drift-
          # free subset of the resource-group tag set: `expires-at` is intentionally
          # NOT exported because it is reset on the RG every deploy and is the only
          # tag the TTL janitor reads (from the RG, never from child resources).
          # author is attacker-influenced (PR author login) so it is passed via env
          # and quoted, never interpolated from github.event.
          {
            echo "EPHEMERAL_CHILD_TAG=true"
            echo "PR_NUMBER_TAG=${PR_NUMBER}"
            echo "AUTHOR_TAG=${PR_AUTHOR}"
            echo "CREATED_AT_TAG=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Configure shared bindings and required infra inputs
        env:
          SHARED_CONTAINER_REGISTRY_NAME: ${{ vars.SHARED_CONTAINER_REGISTRY_NAME }}
          SHARED_CONTAINER_REGISTRY_RESOURCE_GROUP_NAME: ${{ vars.SHARED_CONTAINER_REGISTRY_RESOURCE_GROUP_NAME }}
          SHARED_FOUNDRY_ACCOUNT_NAME: ${{ vars.SHARED_FOUNDRY_ACCOUNT_NAME }}
          SHARED_FOUNDRY_PROJECT_NAME: ${{ vars.SHARED_FOUNDRY_PROJECT_NAME }}
          SHARED_FOUNDRY_RESOURCE_GROUP_NAME: ${{ vars.SHARED_FOUNDRY_RESOURCE_GROUP_NAME }}
          MODEL_DEPLOYMENT_NAME: ${{ vars.SHARED_MODEL_DEPLOYMENT_NAME }}
          ALERT_CONTACT_EMAILS: ${{ vars.AZURE_ALERT_CONTACT_EMAILS }}
          FOUNDRY_AUTHORIZED: ${{ needs.foundry_exception.outputs.authorized == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # Normal PR environments bind to the shared ACR + shared Foundry.
          # Foundry provisioning is derived ONLY from the environment approval
          # signal, not from path/label detection. Detection may request review;
          # approval is what authorizes scarce, billable Foundry capacity.
          {
            echo "DEPLOY_ACR=false"
            echo "DEPLOY_FOUNDRY=${FOUNDRY_AUTHORIZED}"
            echo "SHARED_CONTAINER_REGISTRY_NAME=${SHARED_CONTAINER_REGISTRY_NAME}"
            echo "SHARED_CONTAINER_REGISTRY_RESOURCE_GROUP_NAME=${SHARED_CONTAINER_REGISTRY_RESOURCE_GROUP_NAME}"
            echo "SHARED_FOUNDRY_ACCOUNT_NAME=${SHARED_FOUNDRY_ACCOUNT_NAME}"
            echo "SHARED_FOUNDRY_PROJECT_NAME=${SHARED_FOUNDRY_PROJECT_NAME}"
            echo "SHARED_FOUNDRY_RESOURCE_GROUP_NAME=${SHARED_FOUNDRY_RESOURCE_GROUP_NAME}"
            echo "MODEL_DEPLOYMENT_NAME=${MODEL_DEPLOYMENT_NAME}"
            echo "ENABLE_CONTAINER_APPS_AUTH=false"
          } >> "$GITHUB_ENV"
          echo "::notice::Built-in Container Apps auth is disabled for PR environments; trusted per-PR application OIDC is installed after provisioning."

          # Minimum-viable values for the infra inputs main.bicepparam requires
          # with no default. These are just enough to let `azd provision` run for
          # a small ephemeral app; real budget/alert/observability tuning is
          # Phase 5 (#18) and is intentionally NOT built here.
          {
            echo "AZURE_CONTAINER_APPS_WORKLOAD_PROFILE_TYPE=Consumption"
            echo "AZURE_CONTAINER_APPS_WORKLOAD_PROFILE_MIN_COUNT=0"
            echo "AZURE_CONTAINER_APPS_WORKLOAD_PROFILE_MAX_COUNT=1"
            echo "AZURE_CONTAINER_APP_CPU=0.5"
            echo "AZURE_CONTAINER_APP_MEMORY=1.0Gi"
            echo "AZURE_MONTHLY_BUDGET_AMOUNT=50"
            echo "AZURE_BUDGET_START_DATE=$(date -u +%Y-%m-01)"
            echo "AZURE_ALERT_CONTACT_EMAILS=${ALERT_CONTACT_EMAILS}"
            echo "AZURE_ENABLE_APPLICATION_SIGNAL_ALERTS=false"
            # Provision a closed ingress with non-credential placeholders. A fresh
            # trusted job replaces them before enabling external ingress.
            echo "FANTASY_CARD_OIDC_CLIENT_ID=00000000-0000-4000-8000-000000000000"
            echo "FANTASY_CARD_OIDC_CLIENT_SECRET=provisioning-placeholder-only"
            echo "FANTASY_CARD_SESSION_SECRET_CURRENT=provisioning-placeholder-current-0000"
            echo "FANTASY_CARD_SESSION_SECRET_PREVIOUS=provisioning-placeholder-previous-000"
            echo "FANTASY_CARD_EXTERNAL_INGRESS=false"
          } >> "$GITHUB_ENV"

      - name: azd auth login (OIDC, no stored secrets)
        run: |
          set -euo pipefail
          azd auth login \
            --client-id "$AZURE_OIDC_CLIENT_ID" \
            --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github

      - name: Azure resource login (OIDC, for deployment)
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_OIDC_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate shared platform dependencies
        run: |
          set -euo pipefail

          required=(
            SHARED_CONTAINER_REGISTRY_NAME
            SHARED_CONTAINER_REGISTRY_RESOURCE_GROUP_NAME
            SHARED_FOUNDRY_ACCOUNT_NAME
            SHARED_FOUNDRY_PROJECT_NAME
            SHARED_FOUNDRY_RESOURCE_GROUP_NAME
            MODEL_DEPLOYMENT_NAME
          )
          for variable in "${required[@]}"; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Repository variable ${variable} is empty; refusing to provision against an unresolved shared dependency."
              exit 1
            fi
          done

          if [ "$(az group exists --name "$SHARED_CONTAINER_REGISTRY_RESOURCE_GROUP_NAME" -o tsv)" != "true" ]; then
            echo "::error::Shared ACR resource group ${SHARED_CONTAINER_REGISTRY_RESOURCE_GROUP_NAME} does not exist."
            exit 1
          fi
          az acr show \
            --name "$SHARED_CONTAINER_REGISTRY_NAME" \
            --resource-group "$SHARED_CONTAINER_REGISTRY_RESOURCE_GROUP_NAME" \
            --only-show-errors >/dev/null

          # An approved Foundry exception provisions its own account. Normal PRs
          # must resolve the complete shared account/project/model chain before
          # creating their ephemeral resource group.
          if [ "$DEPLOY_FOUNDRY" = "false" ]; then
            if [ "$(az group exists --name "$SHARED_FOUNDRY_RESOURCE_GROUP_NAME" -o tsv)" != "true" ]; then
              echo "::error::Shared Foundry resource group ${SHARED_FOUNDRY_RESOURCE_GROUP_NAME} does not exist."
              exit 1
            fi
            account_id="$(az cognitiveservices account show \
              --name "$SHARED_FOUNDRY_ACCOUNT_NAME" \
              --resource-group "$SHARED_FOUNDRY_RESOURCE_GROUP_NAME" \
              --query id -o tsv --only-show-errors)"
            az rest \
              --method GET \
              --url "https://management.azure.com${account_id}/projects/${SHARED_FOUNDRY_PROJECT_NAME}?api-version=2025-06-01" \
              --only-show-errors >/dev/null
            az cognitiveservices account deployment show \
              --name "$SHARED_FOUNDRY_ACCOUNT_NAME" \
              --resource-group "$SHARED_FOUNDRY_RESOURCE_GROUP_NAME" \
              --deployment-name "$MODEL_DEPLOYMENT_NAME" \
              --only-show-errors >/dev/null
          fi

      - name: Enforce app-tier concurrency cap
        env:
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SHARED_ACR_NAME: ${{ vars.SHARED_CONTAINER_REGISTRY_NAME }}
          REQUIRES_FOUNDRY: ${{ needs.preflight.outputs.requires_foundry }}
          FOUNDRY_AUTHORIZED: ${{ needs.foundry_exception.outputs.authorized == 'true' && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Count active app-tier PR environments by tag AND by open-PR membership,
          # excluding this PR's own group so a redeploy never counts against itself.
          # Closed/merged PR leaks are surfaced as warnings and left for teardown /
          # janitor cleanup, but they do not consume the live concurrency budget.
          open_prs="$(gh pr list --state open --limit 200 --json number \
            --jq 'map(.number | tostring) | join(",")')"
          echo "Open pull requests considered for app-tier cap: ${open_prs}"

          app_groups="$(az group list \
            --query "[?tags.ephemeral=='true' && tags.\"environment-type\"=='pr-app']" \
            -o json)"
          app_count_out="$(printf '%s' "${app_groups}" | python3 infra/scripts/pr_env_active_count.py \
            --groups-json - \
            --open-pr-numbers "${open_prs}" \
            --current-pr-number "${PR_NUMBER}" \
            --format env)"
          printf '%s\n' "${app_count_out}"
          active="$(printf '%s\n' "${app_count_out}" | awk -F= '$1 == "active_count" { print $2 }')"
          orphan_count="$(printf '%s\n' "${app_count_out}" | awk -F= '$1 == "orphan_count" { print $2 }')"
          orphan_names="$(printf '%s\n' "${app_count_out}" | awk -F= '$1 == "orphan_names" { print $2 }')"
          if [ "${orphan_count}" != "0" ]; then
            echo "::warning::Ignoring ${orphan_count} orphaned pr-app resource group(s) whose PR is no longer open: ${orphan_names}. Run the PR Azure Environment Janitor or inspect close-time teardown."
          fi
          echo "Active app-tier PR environments for open PRs (excluding this PR): ${active}"
          active_foundry=0
          if [ "$REQUIRES_FOUNDRY" = "true" ]; then
            foundry_groups="$(az group list \
              --query "[?tags.ephemeral=='true' && tags.\"environment-type\"=='pr-foundry']" \
              -o json)"
            foundry_count_out="$(printf '%s' "${foundry_groups}" | python3 infra/scripts/pr_env_active_count.py \
              --groups-json - \
              --open-pr-numbers "${open_prs}" \
              --current-pr-number "${PR_NUMBER}" \
              --format env)"
            printf '%s\n' "${foundry_count_out}"
            active_foundry="$(printf '%s\n' "${foundry_count_out}" | awk -F= '$1 == "active_count" { print $2 }')"
            foundry_orphan_count="$(printf '%s\n' "${foundry_count_out}" | awk -F= '$1 == "orphan_count" { print $2 }')"
            foundry_orphan_names="$(printf '%s\n' "${foundry_count_out}" | awk -F= '$1 == "orphan_names" { print $2 }')"
            if [ "${foundry_orphan_count}" != "0" ]; then
              echo "::warning::Ignoring ${foundry_orphan_count} orphaned pr-foundry resource group(s) whose PR is no longer open for cap accounting: ${foundry_orphan_names}. Foundry exceptions require operator cleanup if close-time teardown missed them."
            fi
            echo "Active Foundry exception PR environments for open PRs (excluding this PR): ${active_foundry}"
          fi
          # Authoritative cap check via pr_preflight (fails closed at 3). BLOCKED
          # -> non-zero exit -> the run fails before we provision anything.
          set +e
          output="$(python3 infra/scripts/pr_preflight.py \
            --repo "$BASE_REPO" \
            --pr-number "$PR_NUMBER" \
            --branch "$HEAD_BRANCH" \
            --is-fork false \
            --is-draft false \
            --base-repo "$BASE_REPO" \
            --head-repo "$HEAD_REPO" \
            --referenced-acr-name "$SHARED_ACR_NAME" \
            --active-app-env-count "$active" \
            --requires-foundry "$REQUIRES_FOUNDRY" \
            --foundry-authorized "$FOUNDRY_AUTHORIZED" \
            --active-foundry-env-count "$active_foundry" \
            --format env 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            echo "::error::App-tier concurrency cap or safety check failed; refusing to provision."
            exit 1
          fi

      - name: Assert Foundry provisioning switch integrity
        env:
          FOUNDRY_AUTHORIZED: ${{ needs.foundry_exception.outputs.authorized == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          bicepparam = Path("infra/main.bicepparam").read_text(encoding="utf-8")
          main_bicep = Path("infra/main.bicep").read_text(encoding="utf-8")

          switch_pattern = re.compile(
              r"(?m)^\s*param\s+deployFoundry\s*=\s*bool\s*\(\s*"
              r"readEnvironmentVariable\s*\(\s*'DEPLOY_FOUNDRY'\s*,\s*'false'\s*\)\s*\)\s*$"
          )
          if not switch_pattern.search(bicepparam):
              print(
                  "::error::infra/main.bicepparam must source deployFoundry from "
                  "DEPLOY_FOUNDRY with fail-closed default 'false'."
              )
              sys.exit(1)

          module_wiring_pattern = re.compile(
              r"(?s)module\s+foundry\s+'foundry\.bicep'\s*=\s*\{.*?"
              r"params\s*:\s*\{.*?deployFoundry\s*:\s*deployFoundry\b"
          )
          if not module_wiring_pattern.search(main_bicep):
              print(
                  "::error::infra/main.bicep must pass the deployFoundry switch "
                  "through to foundry.bicep without hardcoding it."
              )
              sys.exit(1)

          authorized = os.environ["FOUNDRY_AUTHORIZED"] == "true"
          effective = os.environ.get("DEPLOY_FOUNDRY", "")
          expected = "true" if authorized else "false"
          if effective != expected:
              print(
                  f"::error::DEPLOY_FOUNDRY effective value is {effective!r}; "
                  f"expected {expected!r} for this approval state."
              )
              sys.exit(1)

          print(f"Foundry switch integrity verified; DEPLOY_FOUNDRY={effective}.")
          PY

      - name: Initialize azd environment
        run: |
          set -euo pipefail
          azd env new "$AZURE_ENV_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" \
            --no-prompt

      - name: Create and atomically tag PR resource group
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # azd creates `rg-${AZURE_ENV_NAME}` only when AZURE_RESOURCE_GROUP is
          # unset. Create that deterministic group first with lifecycle tags in
          # the same ARM create request, then pin azd to it. This removes the
          # provision-success/tag-failure orphan window without changing Bicep's
          # resource-group deployment scope.
          rg="rg-${AZURE_ENV_NAME}"
          environment_type="pr-app"
          if [ "${DEPLOY_FOUNDRY}" = "true" ]; then
            environment_type="pr-foundry"
          fi
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires="$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)"
          exists="$(az group exists --name "$rg" -o tsv)"
          if [ "$exists" = "true" ]; then
            # Preserve azd's service tags for a redeploy while refreshing the TTL.
            rg_id="$(az group show --name "$rg" --query id -o tsv)"
            az tag update --resource-id "$rg_id" --operation merge --tags \
              ephemeral=true environment-type="$environment_type" \
              pr-number="$PR_NUMBER" author="$PR_AUTHOR" created-at="$created" \
              expires-at="$expires" repo="$BASE_REPO" branch="$HEAD_BRANCH"
          elif [ "$exists" = "false" ]; then
            az group create --name "$rg" --location "$AZURE_LOCATION" --tags \
              ephemeral=true environment-type="$environment_type" \
              pr-number="$PR_NUMBER" author="$PR_AUTHOR" created-at="$created" \
              expires-at="$expires" repo="$BASE_REPO" branch="$HEAD_BRANCH" \
              >/dev/null
          else
            echo "::error::Unexpected az group exists result: ${exists}"
            exit 1
          fi
          azd env set AZURE_RESOURCE_GROUP "$rg"

      # provision and deploy are SEPARATE steps (never `azd up`): the design
      # requires distinct logs, gates and failure handling for each.
      - name: azd provision
        run: azd provision --no-prompt

      - name: Tag PR resource group (ephemeral + TTL)
        id: tags
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # RG tags live in the workflow, NOT in Bicep, deliberately:
          #  * infra/main.bicep is targetScope='resourceGroup' and deploys INTO
          #    the RG azd creates, so it cannot tag its own containing RG; the
          #    design forbids changing that scope.
          #  * created-at / expires-at / author / branch are PR-runtime facts,
          #    and expires-at must be reset on every push (design lifecycle).
          #  * the Phase 4 janitor enumerates RESOURCE GROUPS by these tags, so
          #    they must sit on the RG, which only the workflow can set here.
          # merge preserves azd's own tags (e.g. azd-env-name needed for down).
          # author/branch are attacker-influenced -> passed via env, quoted.
          rg="$(azd env get-value AZURE_RESOURCE_GROUP)"
          rg_id="$(az group show -n "$rg" --query id -o tsv)"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires="$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)"
          environment_type="pr-app"
          if [ "${DEPLOY_FOUNDRY}" = "true" ]; then
            environment_type="pr-foundry"
          fi
          az tag update --resource-id "$rg_id" --operation merge --tags \
            ephemeral=true \
            environment-type="$environment_type" \
            pr-number="$PR_NUMBER" \
            author="$PR_AUTHOR" \
            created-at="$created" \
            expires-at="$expires" \
            repo="$BASE_REPO" \
            branch="$HEAD_BRANCH"
          echo "expires_at=${expires}" >> "$GITHUB_OUTPUT"

      - name: azd deploy
        run: azd deploy --no-prompt

      - name: Resolve app URL
        id: endpoint
        run: |
          set -euo pipefail
          # The azd service is the VNet-connected private app. Its ingress starts
          # closed, so SERVICE_WEB_URI is the deterministic eventual external
          # address rather than the initial *.internal FQDN. The trusted auth job
          # receives this same app name and must never choose an app by tag order.
          # An empty-but-successful get-value must fail loudly HERE, not silently
          # flow into the smoke test as a confusing far-from-the-cause failure;
          # `set -euo pipefail` alone does not catch empty-but-zero-exit.
          app_url="$(azd env get-value SERVICE_WEB_URI)"
          app_name="$(azd env get-value AZURE_CONTAINER_APP_NAME)"
          case "$app_url" in
            https://*)
              ;;
            *)
              echo "::error::Resolved app URL is empty or not https:// (got: '${app_url}'); refusing to hand an unknown endpoint to the smoke test."
              exit 1
              ;;
          esac
          case "$app_name" in
            ca-*)
              ;;
            *)
              echo "::error::Resolved Container App name is empty or invalid; refusing to configure an unknown app."
              exit 1
              ;;
          esac
          echo "app_url=${app_url}" >> "$GITHUB_OUTPUT"
          echo "app_name=${app_name}" >> "$GITHUB_OUTPUT"

  # --- Trusted authentication configuration ------------------------------
  # This job intentionally starts on a fresh runner and never checks out the PR
  # head. Directory automation credentials must not share a process boundary
  # with scripts, actions, or tools controlled by pull-request code.
  configure_auth:
    name: Configure trusted PR authentication
    needs: [preflight, deploy]
    if: >-
      always() &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    environment: azure-pr-app
    permissions:
      contents: read
      id-token: write
    outputs:
      smoke_passed: ${{ steps.smoke.outputs.passed }}
      smoke_message: ${{ steps.smoke.outputs.message }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      APP_URL: ${{ needs.deploy.outputs.app_url }}
      APP_NAME: ${{ needs.deploy.outputs.app_name }}
      ENVIRONMENT_NAME: ${{ needs.deploy.outputs.environment_name }}
      OIDC_MARKER: squad-workshop-pr-${{ github.event.pull_request.number }}
      OIDC_TAG: squad-workshop-pr-auth
    steps:
      - name: Check out trusted smoke-test code
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # v3.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Directory automation login
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          creds: ${{ secrets.ENTRA_AUTOMATION_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Create or rotate the PR OIDC application
        run: |
          set -euo pipefail
          applications="$(az rest --method GET \
            --url "https://graph.microsoft.com/v1.0/applications?\$filter=displayName%20eq%20'${OIDC_MARKER}'&\$select=id,appId,displayName,tags" \
            --output json)"
          match_count="$(jq '.value | length' <<<"$applications")"
          if [ "$match_count" -gt 1 ]; then
            echo "::error::More than one Entra application matches the PR marker."
            exit 1
          fi
          if [ "$match_count" -eq 1 ]; then
            if [ "$(jq --arg tag "$OIDC_TAG" '.value[0].tags // [] | contains([$tag])' <<<"$applications")" != true ]; then
              echo "::error::The matching Entra application is not marked as a managed PR registration."
              exit 1
            fi
            application_object_id="$(jq -r '.value[0].id' <<<"$applications")"
            client_id="$(jq -r '.value[0].appId' <<<"$applications")"
          else
            application="$(az rest --method POST \
              --url "https://graph.microsoft.com/v1.0/applications" \
              --headers 'Content-Type=application/json' \
              --body "$(jq -cn --arg name "$OIDC_MARKER" \
                --arg tag "$OIDC_TAG" \
                --arg callback "${APP_URL}/auth/callback" \
                '{displayName:$name,signInAudience:"AzureADMyOrg",tags:[$tag],web:{redirectUris:[$callback]}}')" \
              --output json)"
            application_object_id="$(jq -r '.id' <<<"$application")"
            client_id="$(jq -r '.appId' <<<"$application")"
          fi

          service_principals="$(az rest --method GET \
            --url "https://graph.microsoft.com/v1.0/servicePrincipals?\$filter=appId%20eq%20'${client_id}'&\$select=id,tags" \
            --output json)"
          if [ "$(jq '.value | length' <<<"$service_principals")" -eq 0 ]; then
            az rest --method POST \
              --url "https://graph.microsoft.com/v1.0/servicePrincipals" \
              --headers 'Content-Type=application/json' \
              --body "$(jq -cn --arg app_id "$client_id" --arg tag "$OIDC_TAG" \
                '{appId:$app_id,tags:[$tag]}')" \
              >/dev/null
          else
            service_principal_object_id="$(jq -r '.value[0].id' <<<"$service_principals")"
            az rest --method PATCH \
              --url "https://graph.microsoft.com/v1.0/servicePrincipals/${service_principal_object_id}" \
              --headers 'Content-Type=application/json' \
              --body "$(jq -cn --arg tag "$OIDC_TAG" '{tags:[$tag]}')" \
              >/dev/null
          fi

          az rest --method PATCH \
            --url "https://graph.microsoft.com/v1.0/applications/${application_object_id}" \
            --headers 'Content-Type=application/json' \
            --body "$(jq -cn --arg callback "${APP_URL}/auth/callback" \
              '{web:{redirectUris:[$callback]}}')" \
            >/dev/null

          expires_at="$(date -u -d '+1 day' '+%Y-%m-%dT%H:%M:%SZ')"
          credential="$(az rest --method POST \
            --url "https://graph.microsoft.com/v1.0/applications/${application_object_id}/addPassword" \
            --headers 'Content-Type=application/json' \
            --body "$(jq -cn --arg name "pr-${{ github.event.pull_request.number }}-${{ github.run_id }}" \
              --arg expires "$expires_at" \
              '{passwordCredential:{displayName:$name,endDateTime:$expires}}')" \
            --output json)"
          client_secret="$(jq -r '.secretText' <<<"$credential")"
          credential_key_id="$(jq -r '.keyId' <<<"$credential")"
          if [ -z "$client_secret" ] || [ "$client_secret" = null ]; then
            echo "::error::Microsoft Graph did not return the new OIDC credential."
            exit 1
          fi

          session_current="$(openssl rand -hex 32)"
          session_previous="$(openssl rand -hex 32)"
          echo "::add-mask::$client_secret"
          echo "::add-mask::$session_current"
          echo "::add-mask::$session_previous"
          {
            echo "PR_OIDC_APPLICATION_OBJECT_ID=${application_object_id}"
            echo "PR_OIDC_CLIENT_ID=${client_id}"
            echo "PR_OIDC_CLIENT_SECRET=${client_secret}"
            echo "PR_OIDC_CREDENTIAL_KEY_ID=${credential_key_id}"
            echo "PR_SESSION_SECRET_CURRENT=${session_current}"
            echo "PR_SESSION_SECRET_PREVIOUS=${session_previous}"
          } >> "$GITHUB_ENV"

      - name: Clear directory automation session
        run: |
          set -euo pipefail
          az logout
          az account clear

      - name: Azure resource login
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install trusted authentication configuration and open ingress
        run: |
          set -euo pipefail
          resource_group="rg-${ENVIRONMENT_NAME}"
          az containerapp secret set \
            --resource-group "$resource_group" \
            --name "$APP_NAME" \
            --secrets \
              oidc-client-secret="$PR_OIDC_CLIENT_SECRET" \
              session-secret-current="$PR_SESSION_SECRET_CURRENT" \
              session-secret-previous="$PR_SESSION_SECRET_PREVIOUS" \
            >/dev/null
          az containerapp update \
            --resource-group "$resource_group" \
            --name "$APP_NAME" \
            --set-env-vars "FANTASY_CARD_OIDC_CLIENT_ID=$PR_OIDC_CLIENT_ID" \
            >/dev/null
          az containerapp ingress enable \
            --resource-group "$resource_group" \
            --name "$APP_NAME" \
            --type external \
            --target-port 8000 \
            --transport auto \
            --allow-insecure false \
            >/dev/null

      - name: Verify public Entra challenge (/health/live + /health/ready)
        id: smoke
        run: |
          set -uo pipefail
          set +e
          output="$(python3 infra/scripts/pr_smoke_test.py \
            --base-url "$APP_URL" \
            --deadline-seconds 180 \
            --entra-tenant-id "$AZURE_TENANT_ID" \
            --format env 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          printf '%s\n' "$output" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Directory automation login for credential cleanup
        if: ${{ success() }}
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          creds: ${{ secrets.ENTRA_AUTOMATION_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Remove superseded PR OIDC credentials
        if: ${{ success() }}
        run: |
          set -euo pipefail
          application="$(az rest --method GET \
            --url "https://graph.microsoft.com/v1.0/applications/${PR_OIDC_APPLICATION_OBJECT_ID}?\$select=passwordCredentials" \
            --output json)"
          jq -r --arg keep "$PR_OIDC_CREDENTIAL_KEY_ID" \
            '.passwordCredentials[] | select(.keyId != $keep) | .keyId' <<<"$application" |
            while IFS= read -r key_id; do
              [ -z "$key_id" ] && continue
              az rest --method POST \
                --url "https://graph.microsoft.com/v1.0/applications/${PR_OIDC_APPLICATION_OBJECT_ID}/removePassword" \
                --headers 'Content-Type=application/json' \
                --body "$(jq -cn --arg key_id "$key_id" '{keyId:$key_id}')" \
                >/dev/null
            done
          az logout
          az account clear

  # --- Optional live Foundry validation: sanitized pass/fail evidence only ----
  live_foundry_validation:
    name: Live Foundry validation
    needs: [preflight, deploy, configure_auth]
    # Browser OIDC and CSRF are intentionally not bypassed for CI. The existing
    # health smoke remains automated; live generation requires a manual user login.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.validate.outputs.result }}
      correlation_id: ${{ steps.validate.outputs.correlation_id }}
    steps:
      - name: Exercise sanitized gpt-image-2 card-generation path
        id: validate
        env:
          APP_URL: ${{ needs.deploy.outputs.app_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          app_url = os.environ["APP_URL"].rstrip("/")
          correlation_id = f"live-foundry-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          payload = {
              "title": "Live validation",
              "description": "A safe non-branded fantasy character portrait for infrastructure validation.",
          }

          def record(result: str) -> None:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"result={result}\n")
                  output.write(f"correlation_id={correlation_id}\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Live Foundry validation\n\n")
                  summary.write(f"- Result: {result}\n")
                  summary.write(f"- Correlation ID: `{correlation_id}`\n")

          request = urllib.request.Request(
              f"{app_url}/api/generations",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "X-Correlation-ID": correlation_id,
                  "Idempotency-Key": correlation_id,
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  status_code = response.status
                  response_body = response.read(65536)
          except urllib.error.HTTPError as error:
              record("failed")
              print(
                  f"::error::Live Foundry validation failed (HTTP {error.code}; correlation_id={correlation_id})."
              )
              sys.exit(1)
          except urllib.error.URLError:
              record("failed")
              print(
                  f"::error::Live Foundry validation failed (transport error; correlation_id={correlation_id})."
              )
              sys.exit(1)

          try:
              document = json.loads(response_body)
          except json.JSONDecodeError:
              record("failed")
              print(
                  f"::error::Live Foundry validation failed (non-JSON response; correlation_id={correlation_id})."
              )
              sys.exit(1)

          if (
              status_code != 200
              or document.get("status") != "succeeded"
              or document.get("correlation_id") != correlation_id
          ):
              record("failed")
              print(
                  f"::error::Live Foundry validation failed (unexpected result; correlation_id={correlation_id})."
              )
              sys.exit(1)

          record("passed")
          print(f"Live Foundry validation passed; correlation_id={correlation_id}")
          PY

  # --- Comment: single find-and-update PR comment ----------------------------
  # pull-requests: write lives ONLY on this job. Runs after a real deploy attempt
  # (always()) so it reports pass OR fail, but never for fork/draft (skip).
  comment:
    name: Update PR comment
    needs: [preflight, deploy, configure_auth, live_foundry_validation]
    if: >-
      always() &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post or update the environment comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          ENV_NAME: ${{ needs.deploy.outputs.environment_name }}
          APP_URL: ${{ needs.deploy.outputs.app_url }}
          SMOKE_PASSED: ${{ needs.configure_auth.outputs.smoke_passed }}
          SMOKE_MESSAGE: ${{ needs.configure_auth.outputs.smoke_message }}
          EXPIRES_AT: ${{ needs.deploy.outputs.expires_at }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          AUTH_RESULT: ${{ needs.configure_auth.result }}
          LIVE_VALIDATION_REQUESTED: ${{ needs.preflight.outputs.live_validation_requested }}
          LIVE_VALIDATION_RESULT: ${{ needs.live_foundry_validation.result }}
          LIVE_VALIDATION_STATUS: ${{ needs.live_foundry_validation.outputs.result }}
          LIVE_VALIDATION_CORRELATION_ID: ${{ needs.live_foundry_validation.outputs.correlation_id }}
        with:
          script: |
            // All dynamic content comes from process.env (set above from job
            // outputs); nothing secret is included. SMOKE_MESSAGE is already
            // CI-safe (pr_smoke_test sanitizes it and never echoes response
            // bodies). We never dump the naming module's as_dict (which carries
            // repo) -- only its printable projection reached these outputs.
            const marker = '<!-- pr-azure-env -->';
            const deployOk = process.env.DEPLOY_RESULT === 'success';
            const authOk = process.env.AUTH_RESULT === 'success';
            const smokePassed = process.env.SMOKE_PASSED === 'true';
            const envName = process.env.ENV_NAME || '(name unavailable)';
            const appUrl = process.env.APP_URL || '';
            const expiresAt = process.env.EXPIRES_AT || '(pending)';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;

            // A smoke failure fails the trusted auth job, so AUTH_RESULT is not
            // 'success' even though the app deployed. Detect "smoke ran and did
            // not pass" from its outputs (which persist even though the step
            // exited non-zero) so the developer sees the real smoke reason
            // instead of a generic "did not complete". Healthy is reported ONLY
            // when deploy and authentication succeeded AND smoke passed.
            const smokeRan = process.env.SMOKE_PASSED === 'true'
              || process.env.SMOKE_PASSED === 'false';
            let health;
            if (deployOk && authOk && smokePassed) {
              health = '✅ Healthy — `/health/live` and `/health/ready` passed';
            } else if (smokeRan && !smokePassed) {
              const detail = process.env.SMOKE_MESSAGE || 'smoke test did not pass';
              health = `⚠️ Smoke test failed — ${detail}`;
            } else {
              health = deployOk
                ? '❌ Trusted authentication configuration did not complete'
                : '❌ Deployment did not complete';
            }

            const appLine = appUrl
              ? `**App URL:** ${appUrl}`
              : '**App URL:** _not available (deployment did not reach a running app)_';

            const evidenceLines = [];
            if (process.env.LIVE_VALIDATION_REQUESTED === 'true') {
              const liveStatus = process.env.LIVE_VALIDATION_STATUS || process.env.LIVE_VALIDATION_RESULT || 'unknown';
              const liveCorrelation = process.env.LIVE_VALIDATION_CORRELATION_ID || '(unavailable)';
              evidenceLines.push(`**Live Foundry validation:** ${liveStatus} — correlation ID \`${liveCorrelation}\``);
            }

            const body = [
              marker,
              '## 🌩️ PR Azure environment',
              '',
              appLine,
              `**Environment:** \`${envName}\``,
              `**Health:** ${health}`,
              ...evidenceLines,
              `**Expires:** ${expiresAt}`,
              '',
              `[View workflow run logs](${runUrl})`,
              '',
              '<sub>Ephemeral app-tier environment. Auto-torn-down when this PR is closed (Phase 4).</sub>',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
