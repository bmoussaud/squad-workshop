# Per-PR ephemeral Azure environment: TTL / ORPHAN JANITOR.
#
# Design: docs/design/pr-ephemeral-environments.md ("Janitor path" ~L104-108,
# "Cost & lifecycle" ~L165-170). Mandatory backstop cleanup for environments the
# close-time teardown (pr-environment-teardown.yml) missed: failed close
# workflows, deleted branches, or any resource group that leaked past its TTL.
# Gated Foundry exception groups (`environment-type=pr-foundry`) are NOT
# auto-deleted by TTL inference; the explicit PR close event tears them down, and
# this janitor only surfaces any Foundry groups that still look expired or tied to
# closed PRs.
#
# PRODUCT DECISION (already made): the janitor DELETES IMMEDIATELY on expiry.
# There is no mark-then-delete grace period.
#
# SECURITY MODEL: this is the highest-risk job in the initiative -- a scheduled
# workflow holding delete permissions. Two hard guardrails:
#  1. The reap/keep decision is NOT made in this YAML. `az group list` only
#     produces CANDIDATES; the authoritative, allowlist-based decision lives in
#     the tested Python reaper (infra/scripts/pr_env_reaper.py). The delete loop
#     iterates STRICTLY over the names the reaper returned -- there is no bash or
#     `--query` path that can delete a group the reaper did not name.
#  2. No attacker-controlled `github.event.*` value is interpolated into any
#     `run:` block; the only inputs are the reaper output (constrained Azure RG
#     names), a self-generated timestamp, and a closed-PR list built from the
#     API. All are passed via `env:` and read as quoted shell variables.

name: PR Azure Environment Janitor

on:
  # Daily backstop. NOTE: GitHub disables `schedule` triggers after 60 days of
  # repository inactivity; if the repo goes quiet, re-enable this workflow (or
  # run it via the workflow_dispatch below) to resume automatic reaping.
  schedule:
    - cron: '17 3 * * *'
  # Also run after close-time teardown finishes (success or failure) so closed-PR
  # app-tier leaks are reclaimed promptly by trusted default-branch janitor code.
  workflow_run:
    workflows: ['PR Azure Environment Teardown']
    types: [completed]
  # Manual run, with an optional dry-run that reports what WOULD be reaped
  # without deleting anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be reaped without deleting'
        type: boolean
        required: false
        default: true
      reap_untagged_orphans:
        description: 'Delete verified untagged legacy PR resource groups (requires dry_run=false)'
        type: boolean
        required: false
        default: false

# Default to read-only; the reap job widens only what it needs.
permissions:
  contents: read

# One janitor run at a time: overlapping reaps would race on the same groups.
concurrency:
  group: pr-azure-janitor
  cancel-in-progress: false

jobs:
  reap:
    name: Reap expired / orphaned PR environments
    runs-on: ubuntu-latest
    environment: azure-pr-app
    permissions:
      contents: read # checkout the reaper script
      id-token: write # Azure OIDC login
      pull-requests: read # enumerate closed PRs for orphan reaping
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Azure CLI login (OIDC, for az group list/delete)
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Collect PR state (for orphan reaping)
        id: closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Orphans from a failed close-time teardown are keyed by their
          # immutable pr-number tag. We hand the reaper the set of closed PRs so
          # it can reap a leaked group even if its TTL has not yet elapsed. The
          # 7-day expires-at tag independently backstops anything older than this
          # window. numbers are integers from the API -> a plain comma list.
          nums="$(gh pr list --state closed --limit 200 --json number \
            --jq 'map(.number | tostring) | join(",")')"
          active_nums="$(gh pr list --state open --limit 200 --json number \
            --jq 'map(.number | tostring) | join(",")')"
          gh pr list --state closed --limit 200 --json number,closedAt \
            > "$RUNNER_TEMP/closed-prs.json"
          echo "Closed PRs (recent 200): ${nums}"
          echo "Open PRs (recent 200): ${active_nums}"
          echo "closed_prs=${nums}" >> "$GITHUB_OUTPUT"
          echo "active_prs=${active_nums}" >> "$GITHUB_OUTPUT"

      - name: Evaluate reap set (reaper is authoritative)
        id: reap
        env:
          CLOSED_PRS: ${{ steps.closed.outputs.closed_prs }}
          ACTIVE_PRS: ${{ steps.closed.outputs.active_prs }}
        run: |
          set -euo pipefail
          # --now is injected EXPLICITLY; nothing reads an implicit clock.
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "now=${NOW}"

          # The reaper's tagged path is an allowlist, while its legacy path needs
          # to see untagged groups. Stream the complete RG inventory into the
          # tested decision engine rather than approximating a delete predicate in
          # JMESPath. Name-only candidates still require an inactive, verified
          # closed PR and a 24-hour grace period before they are merely reported.
          candidates="$(az group list -o json)"

          # The reaper consumes the raw `az group list` JSON (name/location/tags),
          # decides reap-or-keep per group with a reason_code, and with
          # --format env emits a `reap_names=` line (+ count) for $GITHUB_OUTPUT.
          # Non-zero exit == malformed input -> fail the run (set -e).
          reap_out="$(printf '%s' "${candidates}" | python3 infra/scripts/pr_env_reaper.py \
            --groups-json - \
            --now "${NOW}" \
            --closed-pr-numbers "${CLOSED_PRS}" \
            --active-pr-numbers "${ACTIVE_PRS}" \
            --closed-prs-json "$RUNNER_TEMP/closed-prs.json" \
            --format env)"
          printf '%s\n' "${reap_out}"
          printf '%s\n' "${reap_out}" >> "$GITHUB_OUTPUT"

      - name: Surface Foundry exceptions needing operator cleanup
        env:
          CLOSED_PRS: ${{ steps.closed.outputs.closed_prs }}
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          foundry_groups="$(az group list \
            --query "[?tags.ephemeral=='true' && tags.\"environment-type\"=='pr-foundry']" \
            -o json)"
          export FOUNDRY_GROUPS_JSON="${foundry_groups}"
          export NOW
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os

          groups = json.loads(os.environ["FOUNDRY_GROUPS_JSON"])
          closed_prs = {
              token.strip()
              for token in os.environ.get("CLOSED_PRS", "").split(",")
              if token.strip()
          }
          now = datetime.fromisoformat(os.environ["NOW"].replace("Z", "+00:00"))

          def parse_expiry(value: str) -> datetime | None:
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except (AttributeError, ValueError):
                  return None
              if parsed.tzinfo is None:
                  return None
              return parsed.astimezone(timezone.utc)

          findings = []
          for group in groups:
              tags = group.get("tags")
              if not isinstance(tags, dict):
                  continue
              name = group.get("name") or "(unnamed)"
              pr_number = tags.get("pr-number", "(missing)")
              expires_at = tags.get("expires-at", "")
              expiry = parse_expiry(expires_at)
              reason = None
              if pr_number in closed_prs:
                  reason = "closed_pr"
              elif expiry is None:
                  reason = "malformed_expiry"
              elif expiry <= now:
                  reason = "expired"
              if reason:
                  findings.append((name, pr_number, expires_at or "(missing)", reason))

          if not findings:
              print("No Foundry exception resource groups need operator cleanup.")
              raise SystemExit(0)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Foundry exception cleanup review\n\n")
              summary.write(
                  "These `pr-foundry` groups are not auto-deleted by the TTL janitor. "
                  "Close-time teardown should delete them; investigate and delete manually if still present.\n\n"
              )
              summary.write("| Resource group | PR | Expires at | Reason |\n")
              summary.write("| --- | --- | --- | --- |\n")
              for name, pr_number, expires_at, reason in findings:
                  print(
                      f"::warning::Foundry exception resource group needs cleanup review: "
                      f"name={name} pr={pr_number} reason={reason} expires_at={expires_at}"
                  )
                  summary.write(f"| `{name}` | `{pr_number}` | `{expires_at}` | `{reason}` |\n")
          PY

      - name: Report verified untagged orphan candidates
        env:
          UNTAGGED_ORPHAN_NAMES: ${{ steps.reap.outputs.untagged_orphan_names }}
        run: |
          set -euo pipefail
          names="$(printf '%s' "${UNTAGGED_ORPHAN_NAMES:-}" | tr ',' ' ')"
          if [ -z "$(printf '%s' "${names}" | tr -d '[:space:]')" ]; then
            echo "No verified untagged orphan candidates."
            exit 0
          fi
          {
            echo "## Untagged PR environment orphan review"
            echo
            echo "These names match the legacy PR convention, have no lifecycle tags, and belong to PRs closed for at least 24 hours. They are **not deleted automatically**."
            echo
            for rg in ${names}; do
              echo "- \`${rg}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for rg in ${names}; do
            echo "::warning::Verified untagged PR environment orphan requires explicit cleanup: ${rg}"
          done

      - name: Delete tagged reaped groups (only what the reaper named)
        env:
          # Reaper output (constrained Azure RG names), passed via env and read
          # as a quoted variable -- never interpolated into the script body.
          REAP_NAMES: ${{ steps.reap.outputs.tagged_reap_names }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail
          # Accept either whitespace- or comma-delimited reap_names; Azure RG
          # names contain neither, so this split is unambiguous.
          names="$(printf '%s' "${REAP_NAMES:-}" | tr ',' ' ')"
          if [ -z "$(printf '%s' "${names}" | tr -d '[:space:]')" ]; then
            echo "Reaper named no groups; nothing to reap."
            exit 0
          fi

          # Dry-run: report only. Scheduled runs have an empty DRY_RUN and delete.
          if [ "${DRY_RUN:-false}" = "true" ]; then
            for rg in ${names}; do
              echo "::notice::[dry-run] would reap resource group ${rg}"
            done
            exit 0
          fi

          # Resilient delete: one failure must not abandon the rest, but the job
          # must still surface a clear failure. We do NOT `|| true` real
          # failures -- only "already gone" (a concurrent teardown/janitor beat
          # us) counts as success.
          failed=""
          for rg in ${names}; do
            echo "Reaping resource group ${rg}"
            if az group delete --name "${rg}" --yes; then
              echo "::notice::Reaped ${rg}"
            elif az group show --name "${rg}" >/dev/null 2>&1; then
              echo "::error::Failed to delete resource group ${rg}"
              failed="${failed} ${rg}"
            else
              echo "Resource group ${rg} already gone; treating as success."
            fi
          done

          if [ -n "${failed}" ]; then
            echo "::error::Janitor failed to delete:${failed}"
            exit 1
          fi
          echo "Janitor complete; all reaped groups deleted."

      - name: Delete verified untagged orphan groups
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reap_untagged_orphans == true }}
        env:
          REAP_NAMES: ${{ steps.reap.outputs.untagged_orphan_names }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail
          names="$(printf '%s' "${REAP_NAMES:-}" | tr ',' ' ')"
          if [ -z "$(printf '%s' "${names}" | tr -d '[:space:]')" ]; then
            echo "No verified untagged orphan groups selected."
            exit 0
          fi
          if [ "${DRY_RUN:-true}" = "true" ]; then
            for rg in ${names}; do
              echo "::notice::[dry-run] would reap verified untagged orphan ${rg}"
            done
            exit 0
          fi
          failed=""
          for rg in ${names}; do
            echo "Reaping verified untagged orphan resource group ${rg}"
            if az group delete --name "${rg}" --yes; then
              echo "::notice::Reaped ${rg}"
            elif az group show --name "${rg}" >/dev/null 2>&1; then
              echo "::error::Failed to delete resource group ${rg}"
              failed="${failed} ${rg}"
            else
              echo "Resource group ${rg} already gone; treating as success."
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::error::Janitor failed to delete:${failed}"
            exit 1
          fi
