name: fantasy-cards
infra:
  provider: bicep
  path: infra
services:
  web:
    project: .
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
hooks:
  postprovision:
    shell: sh
    run: uv run python infra/scripts/verify_rai_policy.py --gate-if-foundry-deployed
